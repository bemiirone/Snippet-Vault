<div class="page">
  <div class="page-header">
    <h1 class="page-title">Library</h1>
    <a routerLink="/new" class="btn btn-primary btn-sm">
      <i class="pi pi-plus" style="font-size: 14px"></i>
      New
    </a>
  </div>

  @if (loading()) {
    <div class="loading">Loading...</div>
  } @else if (error()) {
    <div class="error-banner">{{ error() }}</div>
  } @else {
    <div class="filter-bar">
      <div class="filter-tags">
        @for (tag of allTags(); track tag) {
          <button
            class="tag-chip"
            [class.active]="activeTags().includes(tag)"
            (click)="toggleTag(tag)"
          >
            #{{ tag }}
          </button>
        }
      </div>

      <div class="filter-controls">
        <select
          class="input input-sm"
          (change)="selectedLanguage.set($any($event.target).value)"
        >
          <option value="" [selected]="selectedLanguage() === ''">All Languages</option>
          @for (lang of languages; track lang) {
            <option [value]="lang" [selected]="selectedLanguage() === lang">{{ lang }}</option>
          }
        </select>

        <select
          class="input input-sm"
          (change)="sortBy.set($any($event.target).value)"
        >
          <option value="newest" [selected]="sortBy() === 'newest'">Newest</option>
          <option value="oldest" [selected]="sortBy() === 'oldest'">Oldest</option>
          <option value="alpha" [selected]="sortBy() === 'alpha'">A-Z</option>
        </select>

        <div class="view-toggle">
          <button
            class="btn-icon"
            [class.active]="viewMode() === 'list'"
            (click)="setViewMode('list')"
            aria-label="List view"
          >
            <i class="pi pi-list" style="font-size: 16px"></i>
          </button>
          <button
            class="btn-icon"
            [class.active]="viewMode() === 'grid'"
            (click)="setViewMode('grid')"
            aria-label="Grid view"
          >
            <i class="pi pi-th-large" style="font-size: 16px"></i>
          </button>
        </div>
      </div>
    </div>

    @if (filteredSnippets().length === 0) {
      <div class="empty-state">
        <p class="text-muted">No snippets found.</p>
      </div>
    } @else {
      <div class="snippet-container" [class.grid]="viewMode() === 'grid'">
        @for (snippet of paginatedSnippets(); track snippet._id) {
          <app-snippet-card [snippet]="snippet" [showStarred]="true" (saved)="loadSnippets()" />
        }
      </div>

      <div class="pagination-wrapper">
        <p-paginator
          [rows]="pageSize"
          [totalRecords]="filteredSnippets().length"
          [first]="first()"
          (onPageChange)="onPageChange($event)"
        />
      </div>
    }
  }
</div>
