<div class="layout">
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-header">
      <span class="logo">Vault</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="sidebarOpen.set(false)">
        <i class="pi pi-th-large" style="font-size: 18px"></i>
        Dashboard
      </a>
      <a routerLink="/library" routerLinkActive="active" class="nav-link" (click)="sidebarOpen.set(false)">
        <i class="pi pi-book" style="font-size: 18px"></i>
        Library
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="text-xs text-muted">SnippetVault v0.1</span>
    </div>
  </aside>

  <div class="overlay" [class.visible]="sidebarOpen()" (click)="sidebarOpen.set(false)"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn-icon mobile-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <i class="pi pi-bars" style="font-size: 20px"></i>
      </button>

      <div class="search">
        <i class="pi pi-search search-icon" style="font-size: 16px"></i>
        <input
          type="text"
          class="input search-input"
          placeholder="Search snippets..."
          [value]="searchQuery()"
          (input)="onSearch($event)"
        />
      </div>

      <div class="topbar-actions">
        <span class="sync-status">
          <span class="sync-dot"></span>
          <span class="text-xs text-muted">Synced</span>
        </span>
        <button class="btn-icon" (click)="toggleTheme()" aria-label="Toggle theme">
          @if (theme() === 'dark') {
            <i class="pi pi-sun" style="font-size: 18px"></i>
          } @else {
            <i class="pi pi-moon" style="font-size: 18px"></i>
          }
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
